name: Build Windows exe

# Every push to main that changes the tool or the patches builds
# SwanShellPatcher.exe and puts it in the release v<version>
# (version from swanpatch/__init__.py), created if missing, updated if not.
on:
  push:
    branches: [main]
    paths:
      - 'swanpatch/**'
      - 'swanshell_patcher.py'
      - 'patches/**'
      - '.github/workflows/build.yml'
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pyinstaller
      - name: Version
        id: ver
        shell: bash
        run: echo "v=$(python -c "import swanpatch;print(swanpatch.__version__)")" >> "$GITHUB_OUTPUT"
      - name: Build
        run: >
          pyinstaller --onefile --name SwanShellPatcher
          --add-data "patches;patches"
          --add-data "LICENSE;."
          swanshell_patcher.py
      - name: Smoke test
        run: dist\SwanShellPatcher.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: SwanShellPatcher-windows
          path: dist/SwanShellPatcher.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: SwanShellPatcher ${{ steps.ver.outputs.v }}
          body: |
            START + Y1 (back to the SwanShellDX menu) patches for WonderSwan ROMs.

            - **SwanShellPatcher.exe**: Windows, nothing to install. Double-click for the window, or run it from a command prompt: `SwanShellPatcher.exe ROM_OR_FOLDER -o PATCHES`.
            - Any system: `python swanshell_patcher.py` from the source (Python 3, no other package needed).

            License: GNU GPL v3 or later (LICENSE).

            Copy the `.Y1P` files to `/NILESWAN/PATCHES/` on the SD card. See the README for the methods and options.
          files: |
            dist/SwanShellPatcher.exe
            LICENSE
