name: Build Windows exe

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install pyinstaller unicorn capstone
      - name: Build
        run: >
          pyinstaller --onefile --name SwanShellPatcher
          --add-data "patches;patches"
          --collect-all unicorn --collect-all capstone
          swanshell_patcher.py
      - name: Smoke test
        run: dist\SwanShellPatcher.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: SwanShellPatcher-windows
          path: dist/SwanShellPatcher.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SwanShellPatcher.exe
